<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার অফিশিয়াল ওয়েবসাইট</title>
    <!-- Google SEO Meta Tags -->
    <meta name="description" content="এটি আমার ব্যক্তিগত ওয়েবসাইট ও ব্লগ। এখানে আমার কনটেন্ট ও আপডেট প্রকাশিত হবে।">
    <meta name="robots" content="index, follow">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header {
            text-align: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        header h1 {
            color: #1a73e8;
            font-size: 28px;
        }
        .content {
            margin-bottom: 30px;
        }
        .content h2 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .post {
            background: #fafafa;
            border-left: 4px solid #1a73e8;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
        }
        footer {
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>আমার ওয়েবসাইট ও ব্লগে স্বাগতম</h1>
            <p>আপনার কনটেন্ট প্রকাশের বিশ্বস্ত মাধ্যম</p>
        </header>

        <div class="content">
            <h2>সর্বশেষ পোস্ট</h2>
            <div class="post">
                <h3>প্রথম পোস্ট শিরোনাম</h3>
                <p>এখানে আপনার পোস্টের বিস্তারিত লেখা বা বিবরণ লিখুন।</p>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 সর্বস্বত্ব সংরক্ষিত।</p>
        </footer>
    </div>
</body>
</html>
